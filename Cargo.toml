[workspace]
members = [
    "crates/app-state",
    "crates/converter-cli",
    "crates/converter-core",
    "crates/converter-gui",
    "crates/platform-windows",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.4.25"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
encoding_rs = "0.8"
notify = "8"
predicates = "3"
regex = "1"
rfd = "0.15"
rust_xlsxwriter = { version = "0.90", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.16.0", features = ["unstable-winit-030"] }
slint-build = "1.16.0"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = "line-tables-only"
