name: Build Windows Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use _version.py)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = (Select-String -Path "_version.py" -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Update version in files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          .\scripts\sync-version.ps1 -Version $version

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build release executables
        run: cargo build --release -p converter-gui -p converter-cli

      - name: Prepare release executables
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "target\release\csv-xls-converter-gui.exe" -Destination "dist\CSV-XLS-Converter.exe"
          Copy-Item -Path "target\release\csv-xls-converter.exe" -Destination "dist\CSV-XLS-Converter-CLI.exe"
          Copy-Item -Path "dist\CSV-XLS-Converter.exe" -Destination "dist\CSV-XLS-Converter-$version-Portable.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://jrsoftware.org/download.php/is.exe"
          $installer = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          echo "$innoPath" >> $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: List build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse | Format-Table Name, Length

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: dist/CSV-XLS-Converter-*-Portable.exe
          retention-days: 30

      - name: Upload command-line executable
        uses: actions/upload-artifact@v4
        with:
          name: cli-exe
          path: dist/CSV-XLS-Converter-CLI.exe
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/CSV-XLS-Converter-Setup-*.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout for changelog
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.exe"

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

            if [ -n "$NOTES" ]; then
              echo "Found changelog for version ${VERSION}"
              echo "$NOTES" > release_notes.md
            else
              echo "No changelog found for version ${VERSION}, using auto-generated notes"
              echo "" > release_notes.md
            fi
          else
            echo "CHANGELOG.md not found, using auto-generated notes"
            echo "" > release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ github.ref_name }} --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Deleting existing release..."
            gh release delete ${{ github.ref_name }} --repo ${{ github.repository }} --yes
          fi

          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if [ -s release_notes.md ]; then
            gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "Release ${{ github.ref_name }}" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG \
              artifacts/portable-exe/*.exe \
              artifacts/cli-exe/*.exe \
              artifacts/installer/*.exe
          else
            gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG \
              artifacts/portable-exe/*.exe \
              artifacts/cli-exe/*.exe \
              artifacts/installer/*.exe
          fi
